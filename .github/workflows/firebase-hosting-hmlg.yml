name: Deploy ikomida homologation site to Firebase Hosting on pull request merge
on:
  pull_request_target:
    types:
      - closed
    branches:
      - hmlg
jobs:
  build_and_deploy_ikomida:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ secrets.ARTIFACT_REGISTRY_IKOMIDA_HMLG_SERVICE_ACOUNT }}"
      - id: build
        run: |
          gcloud auth activate-service-account artifact-registry@ikomida-hmlg.iam.gserviceaccount.com --key-file=$GOOGLE_APPLICATION_CREDENTIALS
          npx google-artifactregistry-auth
          rm .npmrc || true
          echo "@ikomida:registry=https://us-central1-npm.pkg.dev/ikomida-hmlg/node/" >> .npmrc && echo "//us-central1-npm.pkg.dev/ikomida-hmlg/node/:always-auth=true" >> .npmrc
          rm firebase.json || true
          echo '{"hosting":{"site":"ikomida-hmlg","public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' >> firebase.json
          yarn install
          yarn hmlg
          mv ./public/build/bundle.js ./public/build/bundle_old.js
          yarn javascript-obfuscator  ./public/build/bundle_old.js --output  ./public/build/bundle.js --config JsObfuscator.js
          rm ./public/build/bundle_old.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_IKOMIDA_HMLG }}"
          channelId: live
          projectId: ikomida-hmlg
          target: ikomida-hmlg
