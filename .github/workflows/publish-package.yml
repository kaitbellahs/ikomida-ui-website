name: publish ikomida main website to firebase hosting on pull request merge
on:
  pull_request:
    branches:
      - dev
      - hmlg
      - main
  # pull_request_target:
  #   types:
  #     - closed
  #   branches:
  #     - dev
  #     - hmlg
  #     - main

env:
  GCLOUD_LOCATION: us-central1

jobs:
  build_and_deploy_ikomida:
    # if: github.event.pull_request.merged == true
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ endsWith(github.ref, '/main') && secrets.ARTIFACT_REGISTRY_IKOMIDA_PROD_SERVICE_ACOUNT || (endsWith(github.ref, '/hmlg') && secrets.ARTIFACT_REGISTRY_IKOMIDA_HMLG_SERVICE_ACOUNT || secrets.ARTIFACT_REGISTRY_IKOMIDA_DEV_SERVICE_ACOUNT) }}"
      - name: Export ENV
        id: env
        run: |-
          PACKAGE_VERSION=$(cat package.json | grep \\\"version\\\" | head -1 | awk -F: '{ print $2 }' | sed 's/[\",]//g' | tr -d '[[:space:]]')
          echo "PACKAGE_VERSION=$(echo $PACKAGE_VERSION)" >> $GITHUB_ENV
          echo "PROJECT_ID=$(echo $GCLOUD_PROJECT)" >> $GITHUB_ENV
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Auth npm with artifactregistry and set gcloud registry url
        run: |-
          echo "Selected gcloud project id: ${PROJECT_ID}"
          rm .npmrc || true
          echo "@ikomida:registry=https://${GCLOUD_LOCATION}-npm.pkg.dev/${PROJECT_ID}/node/" >> .npmrc
          echo "//${GCLOUD_LOCATION}-npm.pkg.dev/${PROJECT_ID}/node/:always-auth=true" >> .npmrc
          yarn glogin
      - id: Builder
        name: Building website app
        run: |-
          yarn install --frozen-lockfile
          BRANCH="${GITHUB_REF##*/}"
          if [[ $BRANCH == "main" ]]
          then
              yarn prod
          elif [[ $BRANCH == "hmlg" ]]
          then
              yarn hmlg
          else
              yarn dev
          fi
      # - name: Obfuscating website files
      #   run: |-
      #     mv ./public/build/bundle.js ./public/build/bundle_old.js
      #     yarn javascript-obfuscator  ./public/build/bundle_old.js --output  ./public/build/bundle.js --config JsObfuscator.json
      #     rm ./public/build/bundle_old.js
      - name: Setup firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: "${{ endsWith(github.ref, '/main') && secrets.FIREBASE_IKOMIDA_PROD_SERVICE_ACOUNT || (endsWith(github.ref, '/hmlg') && secrets.FIREBASE_IKOMIDA_HMLG_SERVICE_ACOUNT || secrets.FIREBASE_IKOMIDA_DEV_SERVICE_ACOUNT) }}"
        run: |-
          FIREBASE_SERVICE_ACCOUNT_FILE="./firebaseServiceAccount.json"
          echo $FIREBASE_SERVICE_ACCOUNT >> $FIREBASE_SERVICE_ACCOUNT_FILE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(echo $FIREBASE_SERVICE_ACCOUNT_FILE)" >> $GITHUB_ENV
          rm firebase.json || true
          echo '{"hosting":{"site":"${PROJECT_ID}","public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' >> firebase.json
      - id: Publisher
        name: Publishing website
        run: |-
          echo "GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --project $PROJECT_ID --only hosting
      - name: Update branch tag version
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "v${PACKAGE_VERSION}"
          git push origin "v${PACKAGE_VERSION}"
